version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: tuesday
      time: "06:43"
      timezone: Asia/Seoul
    groups:
      github-actions-updates:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: gradle
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: thursday
      time: "06:11"
      timezone: Asia/Seoul
    groups:
      gradle-updates:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: "chore(deps)"
