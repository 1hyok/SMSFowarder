name: Release Distribution (Firebase App Distribution)

on:
  push:
    branches: [master]

concurrency:
  group: firebase-app-distribution-upload
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  distribute:
    if: vars.FIREBASE_APP_DISTRIBUTION_ENABLED == 'true'
    name: Build signed release and upload to Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release-distribution
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare release notes
        env:
          RELEASE_NOTES_FILE: ${{ runner.temp }}/firebase-release-notes.txt
        run: |
          set -euo pipefail

          {
            printf 'SMSForwarder release %s\n\n' "${GITHUB_SHA::7}"
            git log -1 --pretty=format:%B
            printf '\n'
          } > "$RELEASE_NOTES_FILE"

          test -s "$RELEASE_NOTES_FILE"
          sed -n '1,120p' "$RELEASE_NOTES_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true

      - name: Verify Firebase destination
        env:
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
        run: |
          if [ -z "$FIREBASE_APP_ID" ]; then
            echo "::error::FIREBASE_APP_ID variable is not configured in release-distribution"
            exit 1
          fi

      - name: Set up release build configuration
        id: release-config
        uses: ./.github/actions/setup-release-config
        with:
          release-store-file-b64: ${{ secrets.RELEASE_STORE_FILE_B64 }}
          release-store-password: ${{ secrets.RELEASE_STORE_PASSWORD }}
          release-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          release-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}
          firebase-service-account-json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Build and verify the signed release APK
        id: release-apk
        env:
          RELEASE_STORE_FILE: ${{ steps.release-config.outputs.keystore-path }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          ./gradlew :app:assembleRelease --no-daemon --stacktrace

          mapfile -t apk_files < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print)
          if [ "${#apk_files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one release APK"
            exit 1
          fi

          apk_path="${apk_files[0]}"
          apksigner_path=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)
          test -n "$apksigner_path"
          "$apksigner_path" verify --verbose --print-certs "$apk_path"

          sha256=$(sha256sum "$apk_path" | awk '{print $1}')
          {
            echo "path=$apk_path"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Attest the signed release APK
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.release-apk.outputs.path }}
          show-summary: false

      - name: Upload the attested APK to Firebase App Distribution
        env:
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'testers' }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.release-config.outputs.firebase-credentials-path }}
          RELEASE_APK_PATH: ${{ steps.release-apk.outputs.path }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/firebase-release-notes.txt
          RELEASE_STORE_FILE: ${{ steps.release-config.outputs.keystore-path }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          actual_sha256=$(sha256sum "$RELEASE_APK_PATH" | awk '{print $1}')
          if [ "$actual_sha256" != "${{ steps.release-apk.outputs.sha256 }}" ]; then
            echo "::error::Release APK changed after attestation"
            exit 1
          fi

          ./gradlew :app:appDistributionUploadRelease \
            --artifactPath="$RELEASE_APK_PATH" \
            --releaseNotesFile="$RELEASE_NOTES_FILE" \
            --no-daemon

          {
            echo "### Firebase App Distribution"
            echo "- source: \`$GITHUB_SHA\`"
            echo "- artifact: \`sha256:${{ steps.release-apk.outputs.sha256 }}\`"
            echo "- attestation: ${{ steps.provenance.outputs.attestation-url }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove release build configuration
        if: always()
        uses: ./.github/actions/cleanup-release-config
        with:
          keystore-path: ${{ steps.release-config.outputs.keystore-path }}
          firebase-credentials-path: ${{ steps.release-config.outputs.firebase-credentials-path }}
