name: Unit Test

# PR 검증은 pr-validation.yml만 시작한다. 정책 스크립트 회귀, JVM unit test,
# Kover XML 생성, androidTest 컴파일을 한 job에서 독립적으로 검증한다.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit-test:
    name: Run Unit Tests (testDebugUnitTest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run CI policy tests
        run: node --test .github/scripts/*.test.mjs

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true

      - name: Run unit tests, Kover report, and androidTest compile guard
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:koverXmlReportDebug
          :app:compileDebugAndroidTestKotlin
          --continue
          --parallel
          --build-cache

      - name: Upload Kover coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kover-debug-coverage
          path: app/build/reports/kover/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
