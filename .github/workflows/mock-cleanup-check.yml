name: Mock Cleanup Check

on:
  workflow_call:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: mock-cleanup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mock-cleanup:
    name: Check MOCK_CLEANUP TODOs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fail when production Kotlin contains MOCK_CLEANUP markers
        run: |
          set -euo pipefail

          if matches=$(git grep -nI 'MOCK_CLEANUP' -- '*.kt' \
            ':(exclude,glob)**/src/debug/**' \
            ':(exclude,glob)**/src/test/**' \
            ':(exclude,glob)**/src/androidTest/**'); then
            echo "::error::MOCK_CLEANUP markers remain in production Kotlin sources"
            printf '%s\n' "$matches"
            exit 1
          else
            grep_status=$?
            if [ "$grep_status" -ne 1 ]; then
              echo "::error::MOCK_CLEANUP scan failed with status $grep_status"
              exit "$grep_status"
            fi
          fi
