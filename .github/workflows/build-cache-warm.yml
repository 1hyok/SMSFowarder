name: Build Cache Warm

# Pull request jobs are cache readers. The trusted master branch is the only
# writer so unreviewed code cannot seed the shared Gradle User Home cache.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-cache-warm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  warm:
    if: github.ref == 'refs/heads/master'
    name: Warm Gradle build cache
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: false
          validate-wrappers: true

      - name: Populate build cache with pull request tasks
        run: >-
          ./gradlew
          :app:ktlintCheck
          :app:lintDebug
          :app:testDebugUnitTest
          :app:koverXmlReportDebug
          :app:compileDebugAndroidTestKotlin
          --continue
          --parallel
          --build-cache
