name: Static Analysis

# PR 검증은 pr-validation.yml만 시작한다. 이 파일은 중복 체크를 만들지 않도록
# reusable workflow로만 호출된다.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  ktlint:
    name: Check Code Quality (Ktlint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true

      - name: Run Ktlint
        run: ./gradlew :app:ktlintCheck --continue --parallel --build-cache

      - name: Upload Ktlint reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ktlint-reports
          path: app/build/reports/ktlint/
          if-no-files-found: warn
          retention-days: 7

  android-lint:
    name: Check Project Issues (Android Lint)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --continue --parallel --build-cache

      - name: Upload Android Lint reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 7
