name: CodeQL

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: '17 19 * * 2'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build_mode: none
            database_language: actions
            source_extensions: .yml,.yaml
            required_path_fragment: .github/workflows/
          - language: java-kotlin
            build_mode: manual
            database_language: java
            source_extensions: .kt
            required_path_fragment: app/src/main/

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        if: matrix.build_mode == 'manual'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and validate wrapper
        if: matrix.build_mode == 'manual'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}

      # CodeQL must observe a real Kotlin compiler invocation, so this build does
      # not opt into the Gradle build cache used by the normal validation jobs.
      - name: Compile application Kotlin sources
        if: matrix.build_mode == 'manual'
        run: >-
          ./gradlew :app:compileDebugKotlin
          --no-configuration-cache
          --stacktrace
          --console=plain

      - name: Analyze and upload CodeQL results
        id: analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}

      - name: Verify analyzed sources in the CodeQL database
        env:
          CODEQL_BUILD_MODE: ${{ matrix.build_mode }}
          CODEQL_DATABASE_LANGUAGE: ${{ matrix.database_language }}
          CODEQL_DATABASE_LOCATIONS: ${{ steps.analyze.outputs.db-locations }}
          CODEQL_DISPLAY_LANGUAGE: ${{ matrix.language }}
          CODEQL_REQUIRED_PATH_FRAGMENT: ${{ matrix.required_path_fragment }}
          CODEQL_SOURCE_EXTENSIONS: ${{ matrix.source_extensions }}
        run: node .github/scripts/verify-codeql-database.mjs
